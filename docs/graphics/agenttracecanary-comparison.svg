<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Structural comparison catches regressions hidden from aggregate counts</title>
<desc id="desc">Aggregate-only comparison flags 0 of 10 cases. AgentTrace Canary flags 10 of 10 cases.</desc>
<rect width="760" height="300" rx="24" fill="#f4f7f4"/><text x="44" y="52" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#15202b">Same counts can hide a changed causal trace</text>
<text x="44" y="104" font-family="system-ui,sans-serif" font-size="16" fill="#465461">Aggregate baseline</text><rect x="230" y="82" width="480" height="30" rx="8" fill="#dce5df"/><rect x="230" y="82" width="0.0" height="30" rx="8" fill="#8a99a6"/><text x="720" y="104" text-anchor="end" font-family="system-ui,sans-serif" font-weight="700" fill="#15202b">0/10</text>
<text x="44" y="170" font-family="system-ui,sans-serif" font-size="16" fill="#465461">Causal audit</text><rect x="230" y="148" width="480" height="30" rx="8" fill="#dce5df"/><rect x="230" y="148" width="480.0" height="30" rx="8" fill="#0b7a75"/><text x="720" y="170" text-anchor="end" font-family="system-ui,sans-serif" font-weight="700" fill="#15202b">10/10</text>
<text x="44" y="230" font-family="system-ui,sans-serif" font-size="14" fill="#5e6b78">Synthetic mutation corpus, seed 20261013. This is regression evidence, not product accuracy.</text>
<text x="44" y="258" font-family="system-ui,sans-serif" font-size="14" fill="#5e6b78">Compared: parent edges, ordered roles, status placement, links, and tool-call invariants.</text></svg>